<title>Pebble Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one riverbed screen — players bar on top, the carved slate board in the middle, controls underneath. */
:root {
  color-scheme: dark;
  --ground: #121B22;
  --ground-2: #18252F;
  --slate: #22313D;
  --slate-edge: #3A4C5B;
  --hole: #0E171E;
  --text: #EEF3F6;
  --muted: #9DB0BE;
  --red: #E5484D;
  --yellow: #F5C518;
  --blue: #3E8EF7;
  --green: #2FB86B;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --radius: 18px;
}
html, body { height: 100%; }
body {
  background:
    radial-gradient(1200px 600px at 10% -10%, #1E3442 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 110%, #1B2E26 0%, transparent 60%),
    var(--ground);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
}
.app {
  max-width: 1040px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 18px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ---------- Header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(26px, 4vw, 36px);
  margin: 0;
  letter-spacing: 0.5px;
  text-wrap: balance;
}
.brand-dots { display: flex; gap: 4px; }
.brand-dots span { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Players ---------- */
.players {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.player {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius);
  background: var(--ground-2);
  border: 2px solid transparent;
  transition: transform .25s ease, border-color .25s ease, background .25s ease, opacity .25s ease;
  min-width: 0;
}
.player .pebble { width: 30px; height: 30px; flex: none; }
.player .who { min-width: 0; }
.player .name { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.player .wins { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.player.active {
  border-color: var(--pc);
  background: color-mix(in srgb, var(--pc) 16%, var(--ground-2));
  transform: translateY(-3px);
}
.player.active .pebble { animation: bob 1.1s ease-in-out infinite; }
.player.dim { opacity: .55; }
.player.winner { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 28%, var(--ground-2)); }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* ---------- Status ---------- */
.status {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 44px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(18px, 2.6vw, 24px);
  text-align: center;
}
.status .pebble { width: 26px; height: 26px; }
.status.pop { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

/* ---------- Board ---------- */
.board-wrap {
  position: relative;
  width: 100%;
  margin: 0 auto;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.board-wrap:focus-visible { outline: 3px solid var(--text); outline-offset: 6px; border-radius: 20px; }
.rail {
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  aspect-ratio: 16 / 1.15;
  padding-inline: var(--pad);
  position: relative;
}
.rail-cell { display: flex; align-items: center; justify-content: center; position: relative; }
.rail-cell .hint {
  position: absolute; bottom: 2px; width: 40%; aspect-ratio: 1; border-radius: 50%;
  background: var(--pc); opacity: 0; transform: scale(.4);
  transition: opacity .2s, transform .2s;
}
.rail-cell.can-win .hint { opacity: .9; transform: scale(.55); animation: twinkle 1s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(.75); opacity: .5; } }
.ghost {
  position: absolute; top: 0;
  width: calc((100% - 2 * var(--pad)) / 16);
  aspect-ratio: 1;
  padding: 6%;
  box-sizing: border-box;
  transition: left .12s ease-out, opacity .15s;
  pointer-events: none;
}
.ghost .pebble { width: 100%; height: 100%; }
.board {
  --pad: 1.4%;
  position: relative;
  display: grid;
  grid-template-columns: repeat(16, 1fr);
  grid-template-rows: repeat(12, 1fr);
  aspect-ratio: 16 / 12;
  padding: var(--pad);
  border-radius: 22px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), transparent 30%),
    var(--slate);
  border: 3px solid var(--slate-edge);
  box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.06);
  cursor: pointer;
}
.board-wrap { --pad: 1.4%; }
.col-glow {
  position: absolute; top: var(--pad); bottom: var(--pad);
  width: calc((100% - 2 * var(--pad)) / 16);
  border-radius: 12px;
  background: color-mix(in srgb, var(--pc) 14%, transparent);
  pointer-events: none;
  transition: left .12s ease-out, opacity .15s;
}
.cell { position: relative; display: flex; align-items: center; justify-content: center; }
.hole {
  width: 84%; aspect-ratio: 1; border-radius: 50%;
  background: var(--hole);
  box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06);
  position: relative;
}
.hole.preview::after {
  content: ""; position: absolute; inset: 14%; border-radius: 50%;
  border: 2px dashed var(--pc); opacity: .7;
}
.cell .pebble { position: absolute; width: 84%; height: 84%; }
.cell .pebble.last::before {
  content: ""; position: absolute; inset: -10%; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.75);
}
.cell .pebble.win { animation: glow 0.9s ease-in-out infinite alternate; z-index: 2; }
@keyframes glow {
  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--pc) 70%, white); transform: scale(1); }
  to   { box-shadow: 0 0 18px 6px color-mix(in srgb, var(--pc) 70%, white); transform: scale(1.12); }
}
.board.shake { animation: shake .35s ease; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

/* Pebbles: color plus a small mark, so players are told apart by more than color. */
.pebble {
  display: block; border-radius: 50%;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,.55) 0 12%, transparent 13%),
    radial-gradient(circle at 50% 60%, var(--pc), color-mix(in srgb, var(--pc) 70%, black));
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.35);
  position: relative;
}
.pebble::after {
  content: ""; position: absolute; inset: 34%;
  background: rgba(255,255,255,.55);
}
.p0 { --pc: var(--red); }    .p0.pebble::after { border-radius: 50%; }
.p1 { --pc: var(--yellow); } .p1.pebble::after { clip-path: polygon(50% 0, 100% 100%, 0 100%); background: rgba(0,0,0,.35); }
.p2 { --pc: var(--blue); }   .p2.pebble::after { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.p3 { --pc: var(--green); }  .p3.pebble::after { inset: 36%; border-radius: 2px; }
.marks-off .pebble::after { display: none; }

.faller { position: absolute; z-index: 5; pointer-events: none; }
.faller .pebble { width: 100%; height: 100%; }
.ripple {
  position: absolute; border-radius: 50%; pointer-events: none; z-index: 4;
  border: 3px solid var(--pc);
}
.spark { position: absolute; border-radius: 50%; pointer-events: none; z-index: 6; }
svg.winline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
svg.winline line { stroke: #fff; stroke-width: 6; stroke-linecap: round; opacity: .85; }

/* ---------- Controls ---------- */
.controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
button {
  font-family: var(--font-display); font-weight: 600; font-size: 16px;
  color: var(--text); background: var(--ground-2);
  border: 2px solid var(--slate-edge); border-radius: 14px;
  padding: 10px 18px; min-height: 46px; cursor: pointer;
  transition: transform .12s ease, background .2s, border-color .2s;
}
button:hover { border-color: var(--muted); }
button:active { transform: translateY(1px) scale(.98); }
button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--yellow); color: #1D1A0E; border-color: var(--yellow); }
button.primary:hover { filter: brightness(1.06); }
button.chip { font-size: 13px; padding: 6px 12px; min-height: 36px; border-radius: 999px; }
button.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--green) 30%, var(--ground-2)); border-color: var(--green); }
.help { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }
kbd {
  font-family: var(--font-body); font-size: 12px; background: var(--ground-2);
  border: 1px solid var(--slate-edge); border-radius: 6px; padding: 1px 6px;
}

/* ---------- Toast & confetti ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%) translateY(20px);
  background: #0B1217; border: 2px solid var(--slate-edge); border-radius: 14px;
  padding: 10px 16px; font-weight: 700; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 20; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 15; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; }

@media (max-width: 640px) {
  .players { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .player { padding: 8px 10px; }
  .board { border-radius: 14px; }
  .hole { width: 88%; }
  .cell .pebble { width: 88%; height: 88%; }
  .help { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div>
      <div class="brand">
        <div class="brand-dots" aria-hidden="true">
          <span class="pebble p0"></span><span class="pebble p1"></span><span class="pebble p2"></span><span class="pebble p3"></span>
        </div>
        <h1>Pebble Drop</h1>
      </div>
      <p class="sub">Four players · 16 × 12 riverbed · connect four to win</p>
    </div>
    <div class="toggles">
      <button class="chip" id="hintsBtn" aria-pressed="false">Winning-move hints</button>
      <button class="chip" id="marksBtn" aria-pressed="true">Shape marks</button>
      <button class="chip" id="soundBtn" aria-pressed="true">Sound</button>
    </div>
  </header>

  <section class="players" id="players" aria-label="Players"></section>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="board-wrap" id="boardWrap" tabindex="0" aria-label="Game board. Use left and right arrows to choose a column, Enter to drop.">
    <div class="rail" id="rail"></div>
    <div class="board" id="board" role="grid" aria-label="16 columns by 12 rows"></div>
  </div>

  <div class="controls">
    <button class="primary" id="newBtn">New Game</button>
    <button id="undoBtn">Undo</button>
    <button id="resetBtn">Reset</button>
  </div>
  <p class="help">Click or tap a column to drop. Keyboard: <kbd>←</kbd> <kbd>→</kbd> choose, <kbd>Enter</kbd> drop, <kbd>U</kbd> undo, <kbd>N</kbd> new game. New Game keeps the score; Reset clears it.</p>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Game: pure rules, no DOM. Board[row][col], row 0 at the top.
   ========================================================= */
const Game = (() => {
  const COLS = 16, ROWS = 12, CONNECT = 4;
  const PLAYERS = [
    { name: "Red" }, { name: "Yellow" }, { name: "Blue" }, { name: "Green" }
  ];
  const EMPTY = -1;
  const DIRECTIONS = [[0, 1], [1, 0], [1, 1], [1, -1]]; // horizontal, vertical, two diagonals

  function create(startPlayer = 0) {
    return {
      board: Array.from({ length: ROWS }, () => Array(COLS).fill(EMPTY)),
      current: startPlayer,
      startPlayer,
      moves: [],
      winner: null,
      winLine: null,
      draw: false
    };
  }

  const isOver = s => s.winner !== null || s.draw;
  const isColumnFull = (s, col) => s.board[0][col] !== EMPTY;

  function landingRow(s, col) {
    for (let r = ROWS - 1; r >= 0; r--) if (s.board[r][col] === EMPTY) return r;
    return -1;
  }

  /** Every cell in a straight run through (row, col) for one direction, in order. */
  function runThrough(board, row, col, dr, dc) {
    const player = board[row][col];
    const cells = [[row, col]];
    for (const sign of [1, -1]) {
      let r = row + dr * sign, c = col + dc * sign;
      while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
        if (sign === 1) cells.push([r, c]); else cells.unshift([r, c]);
        r += dr * sign; c += dc * sign;
      }
    }
    return cells;
  }

  /** The winning four (or longer) through the last move, or null. */
  function findWin(board, row, col) {
    for (const [dr, dc] of DIRECTIONS) {
      const run = runThrough(board, row, col, dr, dc);
      if (run.length >= CONNECT) return run;
    }
    return null;
  }

  /** Drops the current player's pebble. Returns { row, col, player } or null if not allowed. */
  function drop(s, col) {
    if (isOver(s) || col < 0 || col >= COLS || isColumnFull(s, col)) return null;
    const row = landingRow(s, col);
    const player = s.current;
    s.board[row][col] = player;
    s.moves.push({ row, col, player });
    const line = findWin(s.board, row, col);
    if (line) { s.winner = player; s.winLine = line; }
    else if (s.moves.length === ROWS * COLS) s.draw = true;
    else s.current = (player + 1) % PLAYERS.length;
    return { row, col, player };
  }

  function undo(s) {
    const last = s.moves.pop();
    if (!last) return null;
    s.board[last.row][last.col] = EMPTY;
    s.winner = null; s.winLine = null; s.draw = false;
    s.current = last.player;
    return last;
  }

  /** Columns where `player` would connect four right now. */
  function winningColumns(s, player) {
    const cols = [];
    if (isOver(s)) return cols;
    for (let c = 0; c < COLS; c++) {
      const r = landingRow(s, c);
      if (r < 0) continue;
      s.board[r][c] = player;
      if (findWin(s.board, r, c)) cols.push(c);
      s.board[r][c] = EMPTY;
    }
    return cols;
  }

  return { COLS, ROWS, CONNECT, PLAYERS, EMPTY, create, drop, undo, isOver, isColumnFull, landingRow, winningColumns };
})();

/* =========================================================
   Sound: tiny synthesized plinks (start after the first tap).
   ========================================================= */
const Sound = (() => {
  let ctx = null, on = true;
  function ensure() {
    if (!on) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
    } catch (e) { ctx = null; }
    return ctx;
  }
  function tone(freq, start, length, type = "sine", gain = 0.18) {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + length);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + length + 0.02);
  }
  return {
    set enabled(v) { on = v; },
    get enabled() { return on; },
    land(row) { tone(330 + (Game.ROWS - row) * 28, 0, 0.18, "triangle"); },
    tick() { tone(880, 0, 0.05, "sine", 0.06); },
    bump() { tone(140, 0, 0.18, "square", 0.08); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.3, "triangle")); },
    draw() { [392, 349, 330].forEach((f, i) => tone(f, i * 0.14, 0.35, "sine")); }
  };
})();

/* =========================================================
   UI: renders the state and handles input. All rules come from Game.
   ========================================================= */
const UI = (() => {
  const $ = id => document.getElementById(id);
  const els = {
    app: $("app"), players: $("players"), status: $("status"), wrap: $("boardWrap"),
    rail: $("rail"), board: $("board"), toast: $("toast"),
    newBtn: $("newBtn"), undoBtn: $("undoBtn"), resetBtn: $("resetBtn"),
    hintsBtn: $("hintsBtn"), marksBtn: $("marksBtn"), soundBtn: $("soundBtn")
  };
  const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let state = Game.create(0);
  let scores = [0, 0, 0, 0];
  let hoverCol = 7;
  let busy = false;
  let hints = false;
  const cells = [];   // cells[row][col] -> .cell element
  const railCells = [];
  let ghost, colGlow, winSvg;

  // ---------- Build the static DOM once ----------
  function build() {
    for (let c = 0; c < Game.COLS; c++) {
      const rc = document.createElement("div");
      rc.className = "rail-cell";
      rc.innerHTML = '<span class="hint"></span>';
      els.rail.appendChild(rc);
      railCells.push(rc);
    }
    ghost = document.createElement("div");
    ghost.className = "ghost";
    ghost.innerHTML = '<span class="pebble"></span>';
    els.rail.appendChild(ghost);

    colGlow = document.createElement("div");
    colGlow.className = "col-glow";
    els.board.appendChild(colGlow);

    for (let r = 0; r < Game.ROWS; r++) {
      cells.push([]);
      for (let c = 0; c < Game.COLS; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.col = c;
        cell.setAttribute("role", "gridcell");
        cell.innerHTML = '<span class="hole"></span>';
        els.board.appendChild(cell);
        cells[r].push(cell);
      }
    }

    winSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    winSvg.setAttribute("class", "winline");
    els.board.appendChild(winSvg);

    els.players.innerHTML = Game.PLAYERS.map((p, i) => `
      <div class="player p${i}" id="player${i}">
        <span class="pebble p${i}"></span>
        <div class="who"><div class="name">${p.name}</div><div class="wins" id="wins${i}">0 wins</div></div>
      </div>`).join("");
  }

  // ---------- Rendering ----------
  function render() {
    // Pebbles
    const last = state.moves[state.moves.length - 1];
    for (let r = 0; r < Game.ROWS; r++) {
      for (let c = 0; c < Game.COLS; c++) {
        const cell = cells[r][c];
        const p = state.board[r][c];
        let pebble = cell.querySelector(".pebble");
        if (p === Game.EMPTY) { if (pebble) pebble.remove(); }
        else {
          if (!pebble) { pebble = document.createElement("span"); cell.appendChild(pebble); }
          pebble.className = `pebble p${p}`;
          if (last && last.row === r && last.col === c && !state.winner) pebble.classList.add("last");
        }
        cell.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}: ${p === Game.EMPTY ? "empty" : Game.PLAYERS[p].name}`);
      }
    }
    if (state.winLine) for (const [r, c] of state.winLine) cells[r][c].querySelector(".pebble").classList.add("win");
    drawWinLine();

    // Players and status
    Game.PLAYERS.forEach((p, i) => {
      const el = document.getElementById("player" + i);
      el.classList.toggle("active", !Game.isOver(state) && state.current === i);
      el.classList.toggle("winner", state.winner === i);
      el.classList.toggle("dim", state.winner !== null && state.winner !== i);
      document.getElementById("wins" + i).textContent = `${scores[i]} ${scores[i] === 1 ? "win" : "wins"}`;
    });

    let html;
    if (state.winner !== null) html = `<span class="pebble p${state.winner}"></span> ${Game.PLAYERS[state.winner].name} wins! Four in a row.`;
    else if (state.draw) html = "The riverbed is full. It's a draw!";
    else html = `<span class="pebble p${state.current}"></span> ${Game.PLAYERS[state.current].name}'s turn`;
    if (els.status.innerHTML !== html) {
      els.status.innerHTML = html;
      els.status.classList.remove("pop"); void els.status.offsetWidth; els.status.classList.add("pop");
    }

    els.undoBtn.disabled = state.moves.length === 0 || busy;
    els.board.style.cursor = Game.isOver(state) ? "default" : "pointer";
    renderHover();
  }

  function renderHover() {
    const over = Game.isOver(state);
    const pc = `p${state.current}`;
    ghost.className = `ghost ${pc}`;
    ghost.querySelector(".pebble").className = `pebble ${pc}`;
    colGlow.className = `col-glow ${pc}`;
    const pct = (100 - 2 * 1.4) / Game.COLS;
    const left = `calc(1.4% + ${hoverCol * pct}%)`;
    ghost.style.left = left; colGlow.style.left = left;
    const full = Game.isColumnFull(state, hoverCol);
    ghost.style.opacity = over || busy || full ? 0 : 1;
    colGlow.style.opacity = over || full ? 0 : 1;

    // Dashed outline where the pebble would land
    els.board.querySelectorAll(".hole.preview").forEach(h => h.classList.remove("preview"));
    if (!over && !busy && !full) {
      const r = Game.landingRow(state, hoverCol);
      const hole = cells[r][hoverCol].querySelector(".hole");
      hole.classList.add("preview");
      hole.className = `hole preview ${pc}`;
    }

    // Optional hints: columns where the current player can win right now
    const winCols = hints && !busy ? Game.winningColumns(state, state.current) : [];
    railCells.forEach((rc, c) => {
      rc.className = `rail-cell ${pc}` + (winCols.includes(c) ? " can-win" : "");
    });
  }

  function drawWinLine() {
    winSvg.innerHTML = "";
    if (!state.winLine) return;
    const a = cellCentre(state.winLine[0]), b = cellCentre(state.winLine[state.winLine.length - 1]);
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
    line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
    const length = Math.hypot(b.x - a.x, b.y - a.y);
    line.style.strokeDasharray = length;
    line.style.strokeDashoffset = reduceMotion() ? 0 : length;
    winSvg.appendChild(line);
    if (!reduceMotion()) line.animate([{ strokeDashoffset: length }, { strokeDashoffset: 0 }], { duration: 500, fill: "forwards", easing: "ease-out" });
  }

  function cellCentre([r, c]) {
    const boardRect = els.board.getBoundingClientRect();
    const rect = cells[r][c].getBoundingClientRect();
    return { x: rect.left - boardRect.left + rect.width / 2, y: rect.top - boardRect.top + rect.height / 2 };
  }

  // ---------- Moves ----------
  function tryDrop(col) {
    if (busy) return;
    if (Game.isOver(state)) { toast("Game over. Press New Game to play again."); return; }
    if (Game.isColumnFull(state, col)) {
      Sound.bump();
      toast(`Column ${col + 1} is full. Pick another one.`);
      els.board.classList.remove("shake"); void els.board.offsetWidth; els.board.classList.add("shake");
      return;
    }
    const move = Game.drop(state, col);
    if (!move) return;
    animateDrop(move, () => {
      render();
      ripple(move);
      Sound.land(move.row);
      if (state.winner !== null) celebrate();
      else if (state.draw) { Sound.draw(); toast("Every hole is filled. It's a draw!"); }
    });
  }

  function animateDrop(move, done) {
    if (reduceMotion()) { done(); return; }
    busy = true;
    renderHover();
    const wrapRect = els.wrap.getBoundingClientRect();
    const target = cells[move.row][move.col].getBoundingClientRect();
    const railRect = railCells[move.col].getBoundingClientRect();
    const size = target.width * 0.84;
    const faller = document.createElement("div");
    faller.className = "faller";
    faller.style.width = faller.style.height = size + "px";
    const x = target.left - wrapRect.left + (target.width - size) / 2;
    const yStart = railRect.top - wrapRect.top + (railRect.height - size) / 2;
    const yEnd = target.top - wrapRect.top + (target.height - size) / 2;
    faller.style.left = x + "px";
    faller.style.top = yStart + "px";
    faller.innerHTML = `<span class="pebble p${move.player}"></span>`;
    els.wrap.appendChild(faller);

    const distance = yEnd - yStart;
    const duration = 180 + Math.sqrt(Math.max(distance, 1)) * 26;
    const anim = faller.animate([
      { transform: "translateY(0)", easing: "cubic-bezier(.45,0,1,1)" },
      { transform: `translateY(${distance}px)`, offset: 0.72, easing: "ease-out" },
      { transform: `translateY(${distance - Math.min(18, size * 0.45)}px)`, offset: 0.86, easing: "ease-in" },
      { transform: `translateY(${distance}px)` }
    ], { duration, fill: "forwards" });
    anim.onfinish = () => { faller.remove(); busy = false; done(); };
  }

  function ripple(move) {
    if (reduceMotion()) return;
    const cell = cells[move.row][move.col];
    const wrapRect = els.wrap.getBoundingClientRect();
    const rect = cell.getBoundingClientRect();
    const ring = document.createElement("div");
    ring.className = `ripple p${move.player}`;
    const size = rect.width * 0.84;
    ring.style.width = ring.style.height = size + "px";
    ring.style.left = rect.left - wrapRect.left + (rect.width - size) / 2 + "px";
    ring.style.top = rect.top - wrapRect.top + (rect.height - size) / 2 + "px";
    els.wrap.appendChild(ring);
    ring.animate([{ transform: "scale(1)", opacity: 0.9 }, { transform: "scale(1.9)", opacity: 0 }], { duration: 450, easing: "ease-out" })
      .onfinish = () => ring.remove();
  }

  function celebrate() {
    const winner = state.winner;
    scores[winner]++;
    render();
    Sound.win();
    toast(`${Game.PLAYERS[winner].name} connected four!`);
    if (reduceMotion()) return;

    // Sparks fly out of each winning pebble
    const wrapRect = els.wrap.getBoundingClientRect();
    const color = getComputedStyle(document.documentElement).getPropertyValue(["--red", "--yellow", "--blue", "--green"][winner]).trim();
    for (const [r, c] of state.winLine) {
      const rect = cells[r][c].getBoundingClientRect();
      const cx = rect.left - wrapRect.left + rect.width / 2, cy = rect.top - wrapRect.top + rect.height / 2;
      for (let i = 0; i < 10; i++) {
        const s = document.createElement("div");
        s.className = "spark";
        const sz = 4 + Math.random() * 6;
        s.style.width = s.style.height = sz + "px";
        s.style.left = cx - sz / 2 + "px"; s.style.top = cy - sz / 2 + "px";
        s.style.background = i % 3 === 0 ? "#fff" : color;
        els.wrap.appendChild(s);
        const angle = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 60;
        s.animate([
          { transform: "translate(0,0) scale(1)", opacity: 1 },
          { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(.3)`, opacity: 0 }
        ], { duration: 700 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
      }
    }

    // Confetti in all four colors, heavy on the winner's
    const layer = document.createElement("div");
    layer.className = "confetti";
    const palette = [color, color, color, "#E5484D", "#F5C518", "#3E8EF7", "#2FB86B", "#ffffff"];
    for (let i = 0; i < 90; i++) {
      const bit = document.createElement("i");
      bit.style.left = Math.random() * 100 + "%";
      bit.style.background = palette[i % palette.length];
      layer.appendChild(bit);
      bit.animate([
        { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${(Math.random() - .5) * 160}px, ${window.innerHeight + 40}px) rotate(${(Math.random() - .5) * 900}deg)`, opacity: .9 }
      ], { duration: 1800 + Math.random() * 1400, delay: Math.random() * 400, easing: "cubic-bezier(.25,.5,.5,1)", fill: "forwards" });
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 3800);
  }

  // ---------- Buttons ----------
  function newGame() {
    if (busy) return;
    const nextStart = state.moves.length === 0 ? state.startPlayer : (state.startPlayer + 1) % Game.PLAYERS.length;
    state = Game.create(nextStart);
    hoverCol = 7;
    render();
    toast(`New game! ${Game.PLAYERS[nextStart].name} goes first.`);
  }

  function reset() {
    if (busy) return;
    state = Game.create(0);
    scores = [0, 0, 0, 0];
    hoverCol = 7;
    render();
    toast("Scores cleared. Red goes first.");
  }

  function undo() {
    if (busy || state.moves.length === 0) return;
    const hadWinner = state.winner;
    Game.undo(state);
    if (hadWinner !== null) scores[hadWinner] = Math.max(0, scores[hadWinner] - 1);
    Sound.tick();
    render();
  }

  let toastTimer;
  function toast(text) {
    els.toast.textContent = text;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove("show"), 1800);
  }

  // ---------- Input ----------
  function columnFromEvent(e) {
    const rect = els.board.getBoundingClientRect();
    const pad = rect.width * 0.014;
    const x = e.clientX - rect.left - pad;
    return Math.max(0, Math.min(Game.COLS - 1, Math.floor(x / ((rect.width - 2 * pad) / Game.COLS))));
  }

  function setHover(col) {
    if (col === hoverCol) return;
    hoverCol = col;
    renderHover();
  }

  function bindInput() {
    els.wrap.addEventListener("pointermove", e => setHover(columnFromEvent(e)));
    els.wrap.addEventListener("click", e => {
      const col = columnFromEvent(e);
      setHover(col);
      tryDrop(col);
    });
    els.wrap.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") { setHover((hoverCol + Game.COLS - 1) % Game.COLS); Sound.tick(); e.preventDefault(); }
      else if (e.key === "ArrowRight") { setHover((hoverCol + 1) % Game.COLS); Sound.tick(); e.preventDefault(); }
      else if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") { tryDrop(hoverCol); e.preventDefault(); }
    });
    document.addEventListener("keydown", e => {
      if (e.target.tagName === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
      if (e.key === "u" || e.key === "U") undo();
      else if (e.key === "n" || e.key === "N") newGame();
    });
    els.newBtn.addEventListener("click", newGame);
    els.resetBtn.addEventListener("click", reset);
    els.undoBtn.addEventListener("click", undo);
    els.hintsBtn.addEventListener("click", () => {
      hints = !hints;
      els.hintsBtn.setAttribute("aria-pressed", hints);
      renderHover();
    });
    els.marksBtn.addEventListener("click", () => {
      const on = els.app.classList.toggle("marks-off");
      els.marksBtn.setAttribute("aria-pressed", !on);
      document.body.classList.toggle("marks-off", on);
    });
    els.soundBtn.addEventListener("click", () => {
      Sound.enabled = !Sound.enabled;
      els.soundBtn.setAttribute("aria-pressed", Sound.enabled);
      if (Sound.enabled) Sound.tick();
    });
    window.addEventListener("resize", drawWinLine);
  }

  // ---------- Keep the game across page updates ----------
  function snapshot() { return { state, scores, hints }; }
  function restore(data) {
    if (data && data.state && Array.isArray(data.state.board) && data.state.board.length === Game.ROWS) {
      state = data.state; scores = data.scores || scores; hints = !!data.hints;
      els.hintsBtn.setAttribute("aria-pressed", hints);
    }
  }

  function start(data) {
    build();
    restore(data);
    bindInput();
    render();
    window.claude?.hot?.snapshot?.(snapshot);
  }

  return { start };
})();

window.claude?.hot?.ready ? window.claude.hot.ready(UI.start) : UI.start(window.claude?.hot?.data ?? {});
</script>
